<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  
<title>할 일 목록</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e4e7ec;--accent:#3b6df0;--danger:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d222a;--text:#e8eaee;--muted:#9099a8;--line:#2d343f;--accent:#6d93ff;--danger:#ff7a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:620px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
form{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{flex:1;min-width:0;padding:12px 14px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{padding:6px 12px;font-size:.9rem}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input{width:20px;height:20px;accent-color:var(--accent);flex:none}
li .t{flex:1;word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--muted)}
li small{display:block;color:var(--muted);font-size:.75rem}
li .del{border:0;background:none;color:var(--danger);padding:4px 8px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:.85rem}
.foot div{display:flex;gap:8px;flex-wrap:wrap}
.foot button{font-size:.85rem;padding:6px 10px}
</style>
</head>
<body>
  
<main>
  <h1>할 일 목록</h1>
  <p class="sub">이 기기의 브라우저에 저장돼요. 기기마다 목록이 따로예요.</p>

  <form id="f">
    <input type="text" id="title" placeholder="할 일을 입력하세요" autocomplete="off" maxlength="200">
    <button class="primary" type="submit">추가</button>
  </form>

  <div class="tabs" id="tabs">
    <button data-f="active" class="on">진행 중</button>
    <button data-f="done">완료</button>
    <button data-f="all">전체</button>
  </div>

  <div class="card"><div id="list"></div></div>

  <div class="foot">
    <span id="count"></span>
    <div>
      <button id="imp">todos.json 가져오기</button>
      <button id="exp">내보내기</button>
      <button id="clr">완료 항목 삭제</button>
    </div>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</main>

<script>
(function(){
  var KEY="todos-v1", filter="active", items=load();
  var $=function(id){return document.getElementById(id)};

  function load(){
    try{var v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v:[]}
    catch(e){return []}
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(items))}
    catch(e){alert("이 브라우저에서는 저장할 수 없어요. (사생활 보호 모드인지 확인해 주세요)")}
  }
  function nextId(){return items.reduce(function(m,t){return Math.max(m,t.id)},0)+1}
  function now(){var d=new Date(),p=function(n){return String(n).padStart(2,"0")};
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}

  function render(){
    var list=$("list");
    var shown=items.filter(function(t){return filter==="all"||(filter==="done")===!!t.done});
    var done=items.filter(function(t){return t.done}).length;
    $("count").textContent="완료 "+done+" / 전체 "+items.length;
    list.textContent="";
    if(!shown.length){list.className="empty";list.textContent="표시할 할 일이 없어요.";return}
    list.className="";
    var ul=document.createElement("ul");
    shown.forEach(function(t){
      var li=document.createElement("li");if(t.done)li.className="done";
      var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!t.done;
      cb.onchange=function(){t.done=cb.checked;save();render()};
      var box=document.createElement("div");box.className="t";
      box.appendChild(document.createTextNode(t.title));
      var s=document.createElement("small");s.textContent=t.created_at||"";box.appendChild(s);
      var d=document.createElement("button");d.className="del";d.textContent="삭제";
      d.onclick=function(){items=items.filter(function(x){return x!==t});save();render()};
      li.append(cb,box,d);ul.appendChild(li);
    });
    list.appendChild(ul);
  }

  $("f").onsubmit=function(e){
    e.preventDefault();var v=$("title").value.trim();if(!v)return;
    items.push({id:nextId(),title:v,done:false,created_at:now()});
    $("title").value="";save();render();
  };
  $("tabs").onclick=function(e){
    var f=e.target.dataset&&e.target.dataset.f;if(!f)return;filter=f;
    Array.prototype.forEach.call($("tabs").children,function(b){b.classList.toggle("on",b.dataset.f===f)});
    render();
  };
  $("clr").onclick=function(){
    var n=items.filter(function(t){return t.done}).length;
    if(!n||!confirm("완료된 "+n+"개를 삭제할까요?"))return;
    items=items.filter(function(t){return !t.done});save();render();
  };
  $("imp").onclick=function(){$("file").click()};
  $("file").onchange=function(){
    var f=this.files[0];this.value="";if(!f)return;
    f.text().then(function(txt){
      var arr=JSON.parse(txt);if(!Array.isArray(arr))throw 0;
      var n=0;
      arr.forEach(function(o){
        if(!o||typeof o.title!=="string")return;
        items.push({id:nextId(),title:o.title,done:!!o.done,created_at:String(o.created_at||"")});n++;
      });
      save();render();alert(n+"개를 가져왔어요.");
    }).catch(function(){alert("todos.json 형식이 올바르지 않아요.")});
  };
  $("exp").onclick=function(){
    var blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="todos.json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  };

  render();
})();
</script>
</body>
</html>
